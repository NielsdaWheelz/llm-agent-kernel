[project]
name = "llm-agent-kernel"
version = "0.1.0"
description = "Bounded orchestration kernel for tool-using language-model agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Niels-Erik Nandal", email = "nielseriknandal@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "llm-tools @ git+https://github.com/NielsdaWheelz/llm-tools.git@9e6d155f3b64f03495911435b7cae8b8d131f9a2",
    "provider-runtime[codex-sdk] @ git+https://github.com/NielsdaWheelz/llm-calling.git@2cfed97ee5b9b8eb11103b0575eb7f29de00a0bd",
    "openai-codex==0.144.4",
    "pydantic>=2.11,<3",
]

[project.urls]
Repository = "https://github.com/NielsdaWheelz/llm-agent-kernel"
Issues = "https://github.com/NielsdaWheelz/llm-agent-kernel/issues"
Security = "https://github.com/NielsdaWheelz/llm-agent-kernel/security/policy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_agent_kernel"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "build>=1.2.2",
    "pip-audit>=2.9.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-socket>=0.8.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers -m 'not live' --disable-socket --allow-unix-socket"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: opt-in provider qualification requiring an external account",
]
